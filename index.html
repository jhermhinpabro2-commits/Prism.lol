<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Sign-in -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; overflow: hidden; color: white; }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Oswald:wght@400;700&family=Russo+One&family=Staatliches&display=swap');
        
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        .font-russo { font-family: 'Russo One', sans-serif; }
        .font-staat { font-family: 'Staatliches', cursive; }
        .font-default { font-family: 'Segoe UI', sans-serif; }

        .bg-container {
            position: fixed; inset: 0; z-index: -2;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
        }
        #bg-video {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.6;
            display: none;
        }
        .bg-placeholder {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
        }

        .star {
            position: absolute; color: white; font-size: 16px; 
            animation: float 4s infinite ease-in-out; pointer-events: none;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            50% { transform: translateY(-25px) rotate(180deg); opacity: 1; }
        }

        .text-neon {
            text-shadow: 0 0 5px currentColor, 0 0 10px currentColor, 
                         0 0 20px currentColor, 0 0 40px currentColor;
        }
        .text-metallic {
            background: linear-gradient(180deg, #fff, #c0c0c0, #808080, #fff);
            -webkit-background-clip: text; background-clip: text;
            color: transparent; filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
        }

        .avatar-frame-1 { border: 4px solid; border-radius: 50%; }
        .avatar-frame-2 { border-radius: 50%; box-shadow: 0 0 0 4px currentColor, 0 0 25px currentColor; }
        .avatar-frame-3 { border-radius: 50%; border: 4px solid; 
            background: linear-gradient(45deg, transparent, currentColor, transparent); padding: 4px; }
        .avatar-frame-4 { border-radius: 50%; position: relative; }
        .avatar-frame-4::after {
            content: ''; position: absolute; inset: -6px; border-radius: 50%;
            background: linear-gradient(45deg, #39ff14, #00ffff, #ff00ff, #39ff14);
            background-size: 400% 400%; animation: rotateBorder 3s linear infinite; z-index: -1;
        }
        @keyframes rotateBorder { 
            0% { background-position: 0% 50%; } 
            100% { background-position: 400% 50%; } 
        }

        .content {
            position: relative; z-index: 1; display: flex; flex-direction: column;
            align-items: center; padding: 40px 20px; min-height: 100vh;
        }
        .avatar-wrap { position: relative; margin-top: 30px; }
        .avatar-glow {
            position: absolute; inset: -8px; border-radius: 50%;
            filter: blur(10px); opacity: 0.7; z-index: -1;
        }
        .avatar {
            width: 150px; height: 150px; border-radius: 50%;
            background: #222; display: flex; align-items: center; justify-content: center;
            font-size: 60px; overflow: hidden; position: relative;
            border: 2px dashed rgba(255,255,255,0.3);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-placeholder { color: rgba(255,255,255,0.4); font-size: 16px; text-align: center; }

        .username {
            margin-top: 25px; font-size: 42px; font-weight: 900; letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
        }
        .title {
            margin-top: 10px; font-size: 18px; opacity: 0.4; font-style: italic;
        }

        .info-card {
            margin-top: 30px; background: rgba(255,255,255,0.08);
            border-radius: 20px; padding: 20px 25px; backdrop-filter: blur(12px);
            width: 100%; max-width: 380px; border: 1px solid rgba(255,255,255,0.1);
        }
        .info-top { display: flex; align-items: center; gap: 14px; }
        .mini-avatar {
            width: 52px; height: 52px; border-radius: 50%; background: #333; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .mini-placeholder { color: rgba(255,255,255,0.3); font-size: 20px; display: flex; align-items: center; justify-content: center; height: 100%; }
        .info-text { flex: 1; }
        .info-line1 { font-weight: bold; font-size: 17px; color: rgba(255,255,255,0.4); }
        .info-line2 { font-size: 14px; opacity: 0.4; margin-top: 4px; }

        .socials { display: flex; gap: 24px; margin-top: 25px; align-items: center; }
        .socials span { cursor: pointer; transition: 0.3s; color: rgba(255,255,255,0.3); }
        .socials span:hover { transform: scale(1.2); color: white; }
        .socials svg { width: 36px; height: 36px; fill: currentColor; }

        .stats-bar {
            display: flex; align-items: center; gap: 25px; margin-top: 25px;
            font-size: 16px; opacity: 0.7;
        }
        .like-btn {
            display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s;
        }
        .like-btn:hover { transform: scale(1.1); }
        .like-btn.liked span { color: #ff4757; }

        .music-card {
            margin-top: 25px; background: rgba(255,255,255,0.08);
            border-radius: 20px; padding: 18px 22px; backdrop-filter: blur(12px);
            width: 100%; max-width: 380px; display: flex; align-items: center; gap: 14px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .music-icon { font-size: 30px; opacity: 0.4; }

        
    </style>
</head>
<body>

  <div style="background:#12121f;padding:30px;border-radius:20px;box-shadow:0 0 40px rgba(121,40,202,0.25);width:90%;max-width:420px;">

      <button onclick="doSignIn()" style="width:100%;padding:14px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;">🔑 Sign In</button>

    <div style="text-align:center;margin:20px 0 12px 0;color:#555;font-size:13px;">— or —</div>

    <!-- DISCORD LOGIN -->

      🎮 Login with Discord
    </button>
  </div>
</div>

<script>
// === LOGIN CONFIG ===
const DISCORD_CLIENT_ID = "1552714741347127337";
const GOOGLE_CLIENT_ID = "35904855337-0h7ggkf0octlusqlpntk8lsm0gocckqq.apps.googleusercontent.com"; // 📌 Palitan mo ito!
const REDIRECT_URI = window.location.origin + window.location.pathname;
let currentUser = null;
let profileData = {};
let isPlaying = false;

// === DEFAULT PROFILE ===
const DEFAULT_EMPTY = {
    bgVideo: '', avatar: '', username: '', title: '',
    info1: '', info2: '', musicUrl: '', musicName: '',
    mainColor: '#00ff88', textEffect: 'none', fontStyle: 'orbitron',
    frameStyle: '4', discord: '', tiktok: ''
};

// --- DISCORD LOGIN ---
function discordLogin() {
    const authUrl = "https://discord.com/oauth2/authorize"
        + "?client_id=" + DISCORD_CLIENT_ID
        + "&response_type=token"
        + "&scope=identify%20email"
        + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
        + "&prompt=consent";
    window.location.href = authUrl;
}

// ──────────── GOOGLE SIGN-IN ────────────
async function googleLogin() {
  try {
    // Buksan ang Google sign-in
    const authUrl = "https://accounts.google.com/o/oauth2/v2/auth"
      + "?client_id=35904855337-0h7ggkf0octlusqlpntk8lsm0gocckqq.apps.googleusercontent.com"
      + "&response_type=token"
      + "&scope=openid%20email%20profile"
      + "&redirect_uri=" + encodeURIComponent(window.location.origin + window.location.pathname);
    
    window.location.href = authUrl;
  } catch (err) {
    console.error(err);
    alert("❌ Google login failed — try Discord instead!");
  }
}
    

// --- READ LOGIN DATA ---
function getAuthFromUrl() {
    const hash = window.location.hash.substring(1);
    if (!hash) return false;
    
    const params = new URLSearchParams(hash);
    const token = params.get("access_token");
    if (!token) return false;
    
    history.replaceState(null, '', REDIRECT_URI);
    
    // Try Discord first
    fetch("https://discord.com/api/users/@me", {
        headers: { Authorization: "Bearer " + token }
    })
    .then(res => res.json())
    .then(data => {
        if (data.id) {
            let uname = data.username;
            if (data.discriminator && data.discriminator !== "0") {
                uname += "#" + data.discriminator;
            }
            currentUser = {
                id: 'discord_' + data.id,
                provider: 'discord',
                username: uname,
                avatar: data.avatar,
                email: data.email || ""
            };
            localStorage.setItem("current_user", JSON.stringify(currentUser));
            loadUserData();
        }
    })
    .catch(() => {
        // Try Google instead
        fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: "Bearer " + token }
        })
        .then(res => res.json())
        .then(data => {
            if (data.sub) {
                currentUser = {
                    id: 'google_' + data.sub,
                    provider: 'google',
                    username: data.name || data.email?.split('@')[0] || 'User',
                    avatar: data.picture || '',
                    email: data.email || ""
                };
                localStorage.setItem("current_user", JSON.stringify(currentUser));
                loadUserData();
            }
        })
        .catch(() => alert("❌ Login failed — try again"));
    });
    return true;
}

function checkSavedAuth() {
    const saved = localStorage.getItem("current_user");
    if (saved) {
        currentUser = JSON.parse(saved);
        loadUserData();
        return true;
    }
    return false;
}

function loadUserData() {
    if (!currentUser) return;
    
    const saved = localStorage.getItem("profile_" + currentUser.id);
    if (saved) {
        profileData = JSON.parse(saved);
    } else {
        profileData = { ...DEFAULT_EMPTY };
        profileData.username = currentUser.username;
    }
    
    document.getElementById("auth-screen").classList.add("hidden");
    document.getElementById("profile-content").style.display = "flex";
    document.getElementById("edit-toggle").style.display = "block";
    document.getElementById("logout-btn").style.display = "block";
    
    renderProfile();
}

function logout() {
    if (confirm("🚪 Logout?")) {
        localStorage.removeItem("current_user");
        location.reload();
    }
}
// === PROFILE RENDER ===
function renderProfile() {
    const c = profileData.mainColor || '#00ff88';
    document.getElementById('avatar-glow').style.background = c;
    document.getElementById('avatar-glow').style.boxShadow = `0 0 30px ${c}, 0 0 60px ${c}`;
    document.querySelector('.progress-fill').style.background = c;

    const av = document.getElementById('avatar');
    const miniAv = document.getElementById('mini-avatar');
    let avatarUrl = profileData.avatar;
    
    if (!avatarUrl && currentUser?.avatar) {
        if (currentUser.provider === 'discord') {
            avatarUrl = "https://cdn.discordapp.com/avatars/" 
                + currentUser.id.replace('discord_','') + "/" 
                + currentUser.avatar + ".png?size=256";
        } else {
            avatarUrl = currentUser.avatar;
        }
    }
    
    if (avatarUrl) {
        av.innerHTML = `<img src="${avatarUrl}" alt="avatar">`;
        miniAv.innerHTML = `<img src="${avatarUrl}" alt="avatar">`;
        miniAv.style.borderColor = c;
    } else {
        av.innerHTML = `<span class="avatar-placeholder">No Image</span>`;
        miniAv.innerHTML = `<span class="mini-placeholder">?</span>`;
        miniAv.style.borderColor = 'rgba(255,255,255,0.2)';
    }

    av.className = 'avatar';
    if (profileData.frameStyle === '1') { av.classList.add('avatar-frame-1'); av.style.borderColor = c; }
    else if (profileData.frameStyle === '2') { av.classList.add('avatar-frame-2'); av.style.color = c; }
    else if (profileData.frameStyle === '3') { av.classList.add('avatar-frame-3'); av.style.color = c; }
    else if (profileData.frameStyle === '4') { av.classList.add('avatar-frame-4'); }

    const un = document.getElementById('username');
    un.className = 'username';
    un.classList.add(`font-${profileData.fontStyle || 'orbitron'}`);
    un.classList.remove('text-neon', 'text-metallic');
    const displayName = profileData.username || currentUser?.username || 'User';
    un.textContent = displayName;
    un.style.color = c; un.style.opacity = '1';
    if (profileData.textEffect === 'neon') un.classList.add('text-neon');
    else if (profileData.textEffect === 'metallic') un.classList.add('text-metallic');

    const titleEl = document.getElementById('title');
    titleEl.textContent = profileData.title || 'Welcome to my profile!';
    titleEl.style.opacity = profileData.title ? '0.9' : '0.5';

    document.getElementById('info1').textContent = profileData.info1 || 'Customize me!';
    document.getElementById('info2').textContent = profileData.info2 || 'Click ⚙ to edit';

    const vid = document.getElementById('bg-video');
    if (profileData.bgVideo) {
        vid.src = profileData.bgVideo; vid.style.display = 'block';
        document.getElementById('bg-placeholder').style.display = 'none';
        vid.play().catch(() => {});
    } else {
        vid.style.display = 'none';
        document.getElementById('bg-placeholder').style.display = 'block';
    }

    const player = document.getElementById('music-player');
    if (profileData.musicUrl) {
        player.src = profileData.musicUrl; player.volume = 0.5;

        player.removeAttribute('src');
        document.getElementById('music-name').textContent = 'Add music URL';

    ttIcon.style.color = profileData.tiktok ? c : 'rgba(255,255,255,0.3)';
    dcIcon.onclick = profileData.discord ? () => window.open(profileData.discord, '_blank') : null;
    ttIcon.onclick = profileData.tiktok ? () => window.open(profileData.tiktok, '_blank') : null;

    document.getElementById('views-count').textContent = views;
    document.getElementById('likes-count').textContent = likes;

    document.getElementById('in-bg-video').value = profileData.bgVideo || '';
    document.getElementById('in-avatar').value = profileData.avatar || '';
    document.getElementById('in-username').value = profileData.username || '';
    document.getElementById('in-title').value = profileData.title || '';
    document.getElementById('in-info1').value = profileData.info1 || '';
    document.getElementById('in-info2').value = profileData.info2 || '';
    document.getElementById('in-music-url').value = profileData.musicUrl || '';
    document.getElementById('in-music-name').value = profileData.musicName || '';
    document.getElementById('in-main-color').value = profileData.mainColor || '#00ff88';
    document.getElementById('in-text-effect').value = profileData.textEffect || 'none';
    document.getElementById('in-font-style').value = profileData.fontStyle || 'orbitron';
    document.getElementById('in-frame-style').value = profileData.frameStyle || '4';
    document.getElementById('in-discord').value = profileData.discord || '';
    document.getElementById('in-tiktok').value = profileData.tiktok || '';
}

// === SAVE & SETTINGS ===
function toggleSettings() {
    const p = document.getElementById('settings-panel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
}

function saveProfile() {
    if (!currentUser) return alert('Login first!');
    
    profileData.bgVideo = document.getElementById('in-bg-video').value.trim();
    profileData.avatar = document.getElementById('in-avatar').value.trim();
    profileData.username = document.getElementById('in-username').value.trim();
    profileData.title = document.getElementById('in-title').value.trim();
    profileData.info1 = document.getElementById('in-info1').value.trim();
    profileData.info2 = document.getElementById('in-info2').value.trim();
    profileData.musicUrl = document.getElementById('in-music-url').value.trim();
    profileData.musicName = document.getElementById('in-music-name').value.trim();
    profileData.mainColor = document.getElementById('in-main-color').value;
    profileData.textEffect = document.getElementById('in-text-effect').value;
    profileData.fontStyle = document.getElementById('in-font-style').value;
    profileData.frameStyle = document.getElementById('in-frame-style').value;
    profileData.discord = document.getElementById('in-discord').value.trim();
    profileData.tiktok = document.getElementById('in-tiktok').value.trim();

    localStorage.setItem('profile_' + currentUser.id, JSON.stringify(profileData));
    renderProfile(); toggleSettings(); alert('✅ Saved!');
}

function resetProfile() {
    if (!confirm('🔄 Clear your profile?')) return;
    profileData = { ...DEFAULT_EMPTY };
    localStorage.setItem('profile_' + currentUser.id, JSON.stringify(profileData));
    renderProfile(); toggleSettings(); alert('✅ Reset!');
}

// === LIKES & VIEWS ===
let views = parseInt(localStorage.getItem('profile_views') || '0');
let likes = parseInt(localStorage.getItem('profile_likes') || '0');
const visitorId = localStorage.getItem('profile_vid') || (() => {
    const id = 'v_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('profile_vid', id); return id;
})();
const hasViewed = localStorage.getItem('viewed_' + visitorId);
const hasLiked = localStorage.getItem('liked_' + visitorId);

if (!hasViewed) {
    views++; localStorage.setItem('profile_views', views);
    localStorage.setItem('viewed_' + visitorId, 'yes');
}
if (hasLiked) document.getElementById('like-btn')?.classList.add('liked');

function addLike() {
    if (localStorage.getItem('liked_' + visitorId)) { 
        alert('You already liked this! ❤️'); return; 
    }
    likes++; localStorage.setItem('profile_likes', likes);
    localStorage.setItem('liked_' + visitorId, 'yes');
    document.getElementById('likes-count').textContent = likes;
    document.getElementById('like-btn').classList.add('liked');
}

// === MUSIC ===
function togglePlay() {
    if (!profileData.musicUrl) { alert('Add music URL first! 🎵'); return; }
    if (isPlaying) { 
        document.getElementById('music-player').pause(); 
        document.getElementById('play-btn').textContent = '▶'; 
    } else { 
        document.getElementById('music-player').play(); 
        document.getElementById('play-btn').textContent = '⏸'; 
    }
    isPlaying = !isPlaying;
}

document.getElementById('music-player').ontimeupdate = function() {
    const p = document.getElementById('music-player');
    const curr = isNaN(p.currentTime) ? '0:00' : 
        Math.floor(p.currentTime/60) + ':' + (Math.floor(p.currentTime%60)<10?'0':'') + Math.floor(p.currentTime%60);
    const dur = isNaN(p.duration) ? '0:00' : 
        Math.floor(p.duration/60) + ':' + (Math.floor(p.duration%60)<10?'0':'') + Math.floor(p.duration%60);
    document.getElementById('music-duration').textContent = curr + ' — ' + dur;
    document.getElementById('progress-fill').style.width = p.duration ? 
        (p.currentTime / p.duration) * 100 + '%' : '0%';
};

// === STARS BACKGROUND ===
function createStars() {
    const container = document.getElementById('stars-container');
    const symbols = ['*', '✦', '✧', '☆', '✦'];
    for (let i = 0; i < 35; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 4 + 's';
        container.appendChild(star);
    }
}

// === START ===
createStars();

if (!fromUrl) checkSavedAuth();

// ─── DISCORD LOGIN → PUMUNTA SA PROFILE ✅ ───
// Palitan ang lumang discordLogin ng ganito:
const originalDiscordLogin = window.discordLogin;
window.discordLogin = async function() {
  try {
    // Tawagin ang original Discord login
    if (originalDiscordLogin) {
      await originalDiscordLogin();
    }
    
    // Kapag nakabalik na may user → pumunta sa profile
    const checkDiscordUser = setInterval(() => {
      if (currentUser && currentUser.provider === 'discord') {
        clearInterval(checkDiscordUser);
        document.getElementById('auth-screen').style.display = 'none';
        if (typeof loadUser === 'function') loadUser();
        if (typeof renderProfile === 'function') renderProfile();
      }
    }, 300);
    
    // Hintayin hanggang 10 segundo
    setTimeout(() => clearInterval(checkDiscordUser), 10000);
    
  } catch (err) {
    console.error('Discord login error:', err);
    alert('❌ Discord login failed. Try again or use Create Account.');
  }
};

window.addEventListener('load', function() {
  // Hintayin sandali bago mag-check
  setTimeout(() => {
    const activeUser = localStorage.getItem('prism_active_user');
    if (activeUser && !currentUser) {
      const accounts = JSON.parse(localStorage.getItem('prism_accounts') || '{}');
      if (accounts[activeUser]) {
        enterProfile(activeUser);
      }
    }
  }, 500);
});
